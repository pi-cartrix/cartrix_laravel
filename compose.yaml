
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: pi_cartrix_app

    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:80"

    env_file:
      - .env

    environment:
      DB_DSN: mongodb://mongodb:27017

    depends_on:
      mongodb:
        condition: service_healthy

    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - storage_data:/var/www/html/storage
      - bootstrap_cache_data:/var/www/html/bootstrap/cache

  mongodb:
    image: mongo:8.3.8-noble

    container_name: pi_cartrix_mongodb

    restart: unless-stopped

    command: ["mongod", "--bind_ip_all"]

    ports:
      - "127.0.0.1:27018:27017"

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  vendor_data:
  storage_data:
  bootstrap_cache_data:

